<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="John Casana — AI Developer e Ingeniero Electrónico">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f1d58a"/>
      <stop offset="1" stop-color="#d9b45a"/>
    </linearGradient>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1300" height="720">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .r    { opacity: 1; animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .line { stroke-dasharray: 340; stroke-dashoffset: 0; animation: draw 1.1s .8s ease-out backwards; }
    .a1   { animation: drift1 14s ease-in-out infinite; }
    .a2   { animation: drift2 18s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .rev  { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite reverse; }
    .beat { animation: beat 3.2s ease-in-out infinite; }
    @keyframes rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes draw   { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,34px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-30px); } }
    @keyframes beat   { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .r { opacity: 1; }
      .line { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="a1" cx="170" cy="70" r="90" fill="#d9b45a" opacity=".22"/>
      <circle class="a2" cx="790" cy="260" r="110" fill="#5aa9ff" opacity=".18"/>
    </g>
    <rect width="900" height="320" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="319" rx="16" fill="none" stroke="#2a3342"/>

  <!-- texto -->
  <text class="r" style="animation-delay:.1s" x="62" y="88" font-size="13" letter-spacing="5" fill="#8b98a9">HOLA, SOY</text>
  <text class="r" style="animation-delay:.3s" x="60" y="150" font-size="62" font-weight="700" letter-spacing="-1" fill="#f0f4f8">John Casana</text>
  <line class="line" x1="62" y1="172" x2="402" y2="172" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <text class="r" style="animation-delay:.9s" x="62" y="206" font-size="22" font-weight="600" fill="#d9b45a">AI Developer · Ingeniero Electrónico</text>
  <text class="r" style="animation-delay:1.1s" x="62" y="232" font-size="15" fill="#8b98a9">IA generativa, agentes y sistemas de datos · Lima, Perú</text>

  <!-- chips -->
  <g font-size="12.5" text-anchor="middle" fill="#c9d3e0">
    <g class="r" style="animation-delay:1.3s"><rect x="62"  y="252" width="62"  height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="93"  y="270">GenAI</text></g>
    <g class="r" style="animation-delay:1.4s"><rect x="134" y="252" width="52"  height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="160" y="270">RAG</text></g>
    <g class="r" style="animation-delay:1.5s"><rect x="196" y="252" width="76"  height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="234" y="270">Agentes</text></g>
    <g class="r" style="animation-delay:1.6s"><rect x="282" y="252" width="62"  height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="313" y="270">Cloud</text></g>
    <g class="r" style="animation-delay:1.7s"><rect x="354" y="252" width="56"  height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="382" y="270">Data</text></g>
    <g class="r" style="animation-delay:1.8s"><rect x="420" y="252" width="104" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#2f3a4c"/><text x="472" y="270">Electrónica</text></g>
  </g>

  <!-- símbolo (guiño a Hunter x Hunter) -->
  <g transform="translate(760 120)" fill="none" stroke="#d9b45a">
    <g class="rev">
      <circle r="66" stroke-opacity=".35" stroke-dasharray="3 7"/>
      <circle cx="66" cy="0" r="3.5" fill="#5aa9ff" stroke="none"/>
    </g>
    <circle r="50" stroke-opacity=".55" stroke-width="1.5"/>
    <g class="spin"><rect x="-26" y="-26" width="52" height="52" transform="rotate(45)" stroke-opacity=".8" stroke-width="1.5"/></g>
    <circle class="beat" r="5" fill="#d9b45a" stroke="none"/>
  </g>
</svg>
