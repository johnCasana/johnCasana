<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-label="Radar de habilidades">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10151d"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
  <radialGradient id="fill" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".35"/><stop offset="1" stop-color="#d9b45a" stop-opacity=".30"/></radialGradient>
