<style>
  text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .dot { opacity: 0; animation: pop .5s ease-out forwards; }
  .lbl { opacity: 0; animation: fade .8s ease-out forwards; }
  @keyframes pop  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot, .lbl { opacity: 1; } }
</style>
